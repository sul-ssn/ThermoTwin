services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: thermotwin
      POSTGRES_USER: thermotwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U thermotwin']
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://thermotwin:${POSTGRES_PASSWORD:-local-demo-password}@db:5432/thermotwin
      CORS_ORIGINS: http://localhost:3000
    ports: ['8000:8000']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports: ['3000:3000']
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres-data:
